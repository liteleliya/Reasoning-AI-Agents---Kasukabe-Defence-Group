[project]
name = "intelligible-blackboard"
version = "0.0.1"
description = "Intelligible Blackboard Architecture with Counterfactual Agents (PXP-N on a shared blackboard)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/blackboard",
    "src/protocol",
    "src/scheduler",
    "src/agents",
    "src/counterfactual",
    "src/server",
    "src/bench",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]  # Colab scripts with shell magics, not library code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# prompt text is kept one sentence per line, exactly as the model sees it
"src/agents/prompts.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
